<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rediger attraktion</title>
    <link rel="stylesheet" th:href="@{/style.css}">

</head>
<body>
<div class="edit-container">
    <h1>Rediger attraktion</h1>

<form action="#" th:action="@{/attractions/update}" th:object="${attraction}" method="post">
    <label>
        Navn:
        <input type="text" th:field="*{name}" readonly>
        <br>
    </label>
    <label>
        Beskrivelse:
        <input type="text" th:field="*{description}">
        <br>
    </label>
    <label>
        Lokation:
        <input type="text" th:field="*{location}">
        <br>
    </label>
    <label>
        Vælg tags:
        <select th:field="*{tags}" size="1" multiple>
            <option th:each="tag: ${tags}" th:value="${tag}" th:text="${tag}"></option>
        </select>
    </label>
    <br>
    <button type="submit" style="float:left">Bekræft ændringer</button>
    <a th:href="@{/attractions}"><button type="button" style="float:left">Annuller</button></a>
</form>

</body>
</html>
