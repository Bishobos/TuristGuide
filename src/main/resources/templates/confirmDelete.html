<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bekræft sletning</title>
    <link th:href="@{/style.css}" rel="stylesheet">
</head>
<body>
<h1>Bekræft sletning</h1>

<p>Er du sikker på, at du vil slette attraktionen
    <strong th:text="${attractionToDelete.name}"></strong>?</p>

<form th:action="@{/attractions/delete/{name}(name=${attractionToDelete.name})}"
      method="post">
    <button type="submit">Ja, slet</button>
</form>

<a th:href="@{/attractions}">
    <button type="button">Nej, gå tilbage</button>
</a>
</body>
</html>
